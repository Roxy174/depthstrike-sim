[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "depthstrike-sim"
version = "0.3.0.dev0"
description = "RGB-D skeleton-guided target boxing simulator"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.2.6"]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]
display = ["open3d==0.19.0", "opencv-contrib-python==4.11.0.86", "pillow==13.0.0"]
camera = ["mediapipe==0.10.32", "pyorbbecsdk2==2.1.2", "opencv-python==4.11.0.86", "opencv-contrib-python==4.11.0.86", "pillow==13.0.0"]
astra = ["mediapipe==0.10.32", "opencv-contrib-python==4.11.0.86", "cv2-enumerate-cameras==1.1.14", "pillow==13.0.0"]

[project.scripts]
depthstrike = "depthstrike.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
